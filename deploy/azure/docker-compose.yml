# Both portfolio apps on one Azure for Students VM (B1s / B2ats_v2: 1 GiB RAM + swap).
# Expected layout on the VM (setup.sh creates it):
#   ~/apps/tax_rag                    <- this repo
#   ~/apps/Home-Credit-Default-Risk   <- credit scoring repo
# Run from this folder:  docker compose up -d --build
# tax_rag only starts when COMPOSE_PROFILES=tax is set in .env
# (its Gemini index must exist first).
services:
  tax_rag:
    profiles: ["tax"]
    build: ../..
    restart: unless-stopped
    env_file: .env            # GEMINI_API_KEY=... (not committed)
    environment:
      PORT: "8000"
    mem_limit: 450m

  credit:
    build: ../../../Home-Credit-Default-Risk
    restart: unless-stopped
    environment:
      PORT: "8000"
    mem_limit: 450m

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env            # TAX_HOST=..., CREDIT_HOST=...
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
